name: Build HTML to Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: 4. Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 5. Prepare Android WebView Assets from index.html
        run: |
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/index.html
          if [ -d "assets" ]; then cp -r assets/* app/src/main/assets/; fi
          if [ -f "style.css" ]; then cp style.css app/src/main/assets/; fi
          if [ -f "script.js" ]; then cp script.js app/src/main/assets/; fi
          if [ -f "app.js" ]; then cp app.js app/src/main/assets/; fi
          if [ -f "manifest.json" ]; then cp manifest.json app/src/main/assets/; fi

      - name: 6. Compile Android APK with Gradle
        run: gradle assembleDebug --no-daemon

      - name: 7. Upload Ready APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smartapp-debug-apk
          path: app/build/outputs/apk/debug/*.apk
